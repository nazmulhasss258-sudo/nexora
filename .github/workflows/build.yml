      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk NEXORA-Recorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Recorder-APK
          path: NEXORA-Recorder.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexora-build-${{ github.run_number }}
          name: NEXORA Recorder (build ${{ github.run_number }})
          files: NEXORA-Recorder.apk
